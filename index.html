<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Словарь Даля — Старая книга</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="book">
    <div class="page" id="page"></div>

    <button class="nav-btn" id="prevBtn" aria-label="Предыдущая страница">← Назад</button>
    <button class="nav-btn" id="nextBtn" aria-label="Следующая страница">Вперёд →</button>

    <!-- Кнопка «К оглавлению» -->
    <button class="nav-btn toc-btn" id="tocBtn" aria-label="Оглавление">☰ Оглавление</button>
  </div>

  <!-- Звук перелистывания (положи файл flip.mp3 рядом с index.html) -->
  <audio id="flipSound" src="flip.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
